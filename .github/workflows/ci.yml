name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build huddle-watch, so the watch tests cover it too
        if: matrix.python == '3.x'
        run: cargo build --release --manifest-path watch/Cargo.toml
      - run: python -m unittest discover -s tests -v

  watch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --manifest-path watch/Cargo.toml
      - run: cargo clippy --release --manifest-path watch/Cargo.toml -- -D warnings
